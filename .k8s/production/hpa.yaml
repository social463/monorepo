apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: legends-hpa-legends
  namespace: legends
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: legends-legends
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
