version: 0.0
os: linux

files:
  - source: /
    destination: /home/ubuntu/Legends
    overwrite: true
file_exists_behavior: OVERWRITE

hooks:
  ApplicationStop:
    - location: clean.sh
      timeout: 60
      runas: ubuntu

  AfterInstall:
    - location: start.sh
      timeout: 300
      runas: ubuntu
