server {
  listen 80 default_server;
  listen [::]:80 default_server;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # O padrão do nginx é 1 MB, e a API recebe corpos maiores que isso em dois
    # caminhos: o upload de asset do mapa (10 MB, `maxAssetBytes`) e o
    # salvamento do documento do escritório, que manda o mapa INTEIRO a cada
    # Salvar — o mapa decorado da EMR já pesa 800 KB. Acompanha o `bodyLimit`
    # das rotas de documento em `routes/office-maps.ts`; sem os dois, o save
    # morre em 413 antes de a validação do documento ter chance de responder.
    client_max_body_size 11m;

    proxy_pass http://127.0.0.1:3333/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # O escritório virtual mantém um WebSocket aberto o dia todo. Sem isso, o
    # timeout padrão de leitura do nginx (60s) derruba o socket assim que
    # ninguém anda por um minuto — mesmo com o heartbeat da API por trás.
    proxy_read_timeout 3600s;
  }

  location /highlights/ {
    proxy_pass http://127.0.0.1:3333/highlights/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    # Painéis de RH são iframes de terceiro. A política tem UMA diretiva só de
    # propósito: sem default-src, nada além de frames fica restrito, então
    # Phaser (blob workers), LiveKit (wss), imagens do S3 e estilos inline do
    # Tailwind seguem funcionando. Uma CSP completa é tarefa própria.
    #
    # Esta lista precisa bater com HR_DASHBOARD_DEFAULT_ALLOWED_HOSTS /
    # HR_DASHBOARD_ALLOWED_HOSTS em apps/api/src/lib/config.ts, MAIS os hosts
    # do YouTube: o player de aula (`toVideoEmbedUrl`) e o áudio compartilhado
    # da sala do escritório embutem vídeo por iframe, e sem eles aqui o
    # navegador bloqueia os dois em produção.
    add_header Content-Security-Policy "frame-src 'self' https://app.powerbi.com https://lookerstudio.google.com https://datastudio.google.com https://www.youtube.com https://www.youtube-nocookie.com;" always;
    try_files $uri $uri/ /index.html;
  }
}
